<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPulse - Extreme AI Optimization</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <style>
        :root {
            --bg-color: #020204;
            --glass-bg: rgba(12, 12, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-blur: blur(30px);
            --accent-cyan: #00f2fe;
            --accent-purple: #7000ff;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --danger-neon: #ff0055;
            --warning-neon: #ffaa00;
            --success-neon: #00ff77;
            --text-main: #f0f0f5;
            --text-dim: #8b92a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.08), transparent 30%),
                radial-gradient(circle at 50% 90%, rgba(255, 0, 85, 0.05), transparent 40%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .glass-panel:hover {
            border-color: rgba(0, 242, 254, 0.2);
            box-shadow: 0 15px 40px 0 rgba(0, 242, 254, 0.05);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            flex-shrink: 0;
            background: linear-gradient(90deg, rgba(12,12,20,0.8), rgba(20,20,40,0.6));
        }

        .header-title {
            font-weight: 900;
            font-size: 24px;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            font-weight: 700;
        }

        .status-dot {
            width: 8px; height: 8px;
            background-color: var(--success-neon);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success-neon);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 119, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 119, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 119, 0); }
        }

        .controls-row {
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }

        /* Profiles Bar */
        .profiles-bar {
            display: flex;
            gap: 8px;
            flex: 2;
        }
        
        .profile-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        
        .profile-btn:hover {
            background: rgba(0, 242, 254, 0.05);
            color: var(--text-main);
        }
        
        .profile-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(112, 0, 255, 0.15));
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
        }

        /* Filters Bar */
        .filters-bar {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* Scroll Area */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 8px;
        }

        /* Metric Grid (Dynamic) */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .widget {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .widget-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .widget-actions {
            display: flex;
            gap: 6px;
        }
        
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .action-btn:hover { color: var(--accent-cyan); }

        .primary-metric {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        
        .primary-metric.cyan { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0,242,254,0.3); }
        .primary-metric.purple { color: #b088ff; text-shadow: 0 0 10px rgba(112,0,255,0.4); }
        .primary-metric.danger { color: var(--danger-neon); text-shadow: 0 0 10px rgba(255,0,85,0.4); }
        
        .metric-unit { font-size: 14px; color: var(--text-dim); font-weight: 600; }

        /* Bars */
        .bar-wrap { margin-top: 4px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
        .bar-container { width: 100%; height: 6px; background: rgba(0, 0, 0, 0.6); border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .bg-cyan { background: linear-gradient(90deg, #005c97, var(--accent-cyan)); }
        .bg-purple { background: linear-gradient(90deg, #3a1c71, var(--accent-purple)); }
        .bg-danger { background: linear-gradient(90deg, #ff0844, var(--danger-neon)); }
        .bg-warning { background: linear-gradient(90deg, #f6d365, var(--warning-neon)); }
        .bg-success { background: linear-gradient(90deg, #0ba360, var(--success-neon)); }

        /* Core Grid */
        .core-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .core-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .core-id { font-size: 9px; font-weight: 800; color: var(--text-dim); }
        .core-usage { font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 700; color: #fff; }
        .core-freq { font-family: 'JetBrains Mono'; font-size: 9px; color: var(--accent-cyan); }
        
        /* Details list */
        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        .d-lbl { color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
        .d-val { font-family: 'JetBrains Mono'; font-weight: 700; color: #fff; }
        .c-green { color: var(--success-neon); }
        .c-red { color: var(--danger-neon); }
        .c-cyan { color: var(--accent-cyan); }
        .c-yellow { color: var(--warning-neon); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .loader {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace; font-size: 24px;
            letter-spacing: 4px; font-weight: 800;
        }

        .btn-refresh {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--accent-cyan);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-refresh:active { background: var(--accent-cyan); color: #000; }
        
        .collapsed-widget {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .collapsed-widget .primary-metric { font-size: 16px; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const PROFILES = [
            { id: 'AI INFERENCE', desc: 'Max VRAM allocation, AVX-512 prioritization.' },
            { id: 'EXTREME GAMING', desc: 'Max GPU/CPU priority, latency optimized.' },
            { id: 'DATA ANALYSIS', desc: 'Max RAM I/O, storage throughput optimized.' },
            { id: 'SILENT WORK', desc: 'Low power target, zero-rpm fans, max efficiency.' },
            { id: 'MAX POWER', desc: '100% TDP unlocked, ignore thermal limits.' }
        ];

        const FILTERS = ['ALL', 'COMPUTE', 'MEMORY', 'IO_NET', 'SECURITY'];

        const App = () => {
            const [stats, setStats] = useState(null);
            const [connected, setConnected] = useState(false);
            const [activeProfile, setActiveProfile] = useState('AI INFERENCE');
            const [activeFilter, setActiveFilter] = useState('ALL');
            const [collapsed, setCollapsed] = useState({});

            const toggleCollapse = (id) => {
                setCollapsed(prev => ({...prev, [id]: !prev[id]}));
            };

            const applyProfile = (profileId) => {
                setActiveProfile(profileId);
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.apply_optimization_profile(profileId).then(res => {
                        console.log("Profile applied:", res);
                        if (res.requires_restart) {
                            alert("Profile applied successfully. A system restart is required for some kernel changes.");
                        } else {
                            // alert(`Profile ${profileId} applied successfully.`);
                        }
                        triggerRefresh();
                    }).catch(err => console.error("Error applying profile:", err));
                }
            };

            const triggerRefresh = () => {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.get_stats().then(data => setStats(enrichMockData(data)));
                }
            };

            const enrichMockData = (data) => {
                // The backend (html_dashboard.py) now provides all these fields natively.
                // We just pass it through.
                return data;
            };

            useEffect(() => {
                const initApi = () => {
                    if (window.pywebview && window.pywebview.api) {
                        setConnected(true);
                        const poll = () => {
                            window.pywebview.api.get_stats().then(data => {
                                setStats(enrichMockData(data));
                            }).catch(err => console.error(err));
                        };
                        poll();
                        const interval = setInterval(poll, 1500);
                        return () => clearInterval(interval);
                    } else {
                        // Dev mode mock fallback
                        if (window.location.protocol === 'file:' && !window.pywebview) {
                            setConnected(true);
                            const mockInterval = setInterval(() => {
                                setStats(enrichMockData({
                                    cpu_percent: Math.random() * 100,
                                    cpu_temp: 65 + Math.random() * 20,
                                    ram_percent: 60 + Math.random() * 10,
                                    gpu_nvidia_percent: Math.random() * 100,
                                    uptime_str: '01:23:45'
                                }));
                            }, 1500);
                            return () => clearInterval(mockInterval);
                        }
                        setTimeout(initApi, 100);
                    }
                };
                initApi();
                window.addEventListener('pywebviewready', initApi);
            }, []);

            if (!connected || !stats) {
                return <div className="loader">INITIALIZING NOVAPULSE 2.4 KERNEL...</div>;
            }

            const getBarColor = (val, thresholds) => {
                if (val >= thresholds[1]) return 'bg-danger';
                if (val >= thresholds[0]) return 'bg-warning';
                return 'bg-cyan';
            };

            // Widget Builder Helper
            const Widget = ({ id, title, icon, category, children, mainValue, mainUnit }) => {
                if (activeFilter !== 'ALL' && category !== activeFilter) return null;
                
                const isCollapsed = collapsed[id];
                
                if (isCollapsed) {
                    return (
                        <div className="glass-panel collapsed-widget" onClick={() => toggleCollapse(id)}>
                            <div className="widget-title"><span style={{fontSize:'14px'}}>{icon}</span> {title}</div>
                            <div className="primary-metric" style={{fontSize: '18px'}}>
                                {mainValue} <span className="metric-unit" style={{fontSize: '10px'}}>{mainUnit}</span>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="glass-panel widget">
                        <div className="widget-header">
                            <span className="widget-title"><span style={{fontSize:'14px'}}>{icon}</span> {title}</span>
                            <div className="widget-actions">
                                <button className="btn-refresh" onClick={triggerRefresh}>SYNC</button>
                                <button className="action-btn" onClick={() => toggleCollapse(id)}>▼</button>
                            </div>
                        </div>
                        {children}
                    </div>
                );
            };

            return (
                <div className="app-container">
                    <header className="glass-panel header">
                        <div className="header-title">NOVAPULSE <span style={{color:'var(--accent-cyan)'}}>2.4</span></div>
                        <div className="header-status">
                            <div className="status-dot"></div>
                            QWEN AUDIT LOCK • {stats.uptime_str || '00:00:00'}
                        </div>
                    </header>

                    <div className="controls-row">
                        <div className="glass-panel profiles-bar">
                            {PROFILES.map(p => (
                                <div 
                                    key={p.id} 
                                    className={`profile-btn ${activeProfile === p.id ? 'active' : ''}`}
                                    onClick={() => applyProfile(p.id)}
                                >
                                    {p.id}
                                </div>
                            ))}
                        </div>
                        <div className="glass-panel filters-bar" style={{padding: '8px'}}>
                            {FILTERS.map(f => (
                                <button 
                                    key={f}
                                    className={`filter-btn ${activeFilter === f ? 'active' : ''}`}
                                    onClick={() => setActiveFilter(f)}
                                >
                                    {f}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="scroll-area">
                        <div className="metrics-grid">
                            
                            {/* CPU Widget */}
                            <Widget id="cpu" title="CPU PACKAGE (i5-11300H)" icon="🧠" category="COMPUTE" mainValue={stats.cpu_percent?.toFixed(1)} mainUnit="%">
                                <div className="primary-metric cyan">
                                    {stats.cpu_percent?.toFixed(1)} <span className="metric-unit">% LOAD</span>
                                </div>
                                <div className="bar-wrap">
                                    <div className="bar-container"><div className={`bar-fill ${getBarColor(stats.cpu_percent, [70, 90])}`} style={{width: `${stats.cpu_percent}%`}}></div></div>
                                </div>
                                <div className="core-grid">
                                    {stats.cpu_cores && stats.cpu_cores.map((u, i) => (
                                        <div key={i} className="core-box">
                                            <span className="core-id">C{i}</span>
                                            <span className="core-usage" style={{color: u > 80 ? 'var(--danger-neon)' : u > 50 ? 'var(--warning-neon)' : 'var(--success-neon)'}}>{u.toFixed(0)}%</span>
                                            <span className="core-freq">{stats.cpu_core_freqs_ghz[i]}GHz</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="detail-list" style={{marginTop: '12px'}}>
                                    <div className="detail-row"><span className="d-lbl">Package Temp</span><span className={`d-val ${stats.cpu_temp > 85 ? 'c-red' : 'c-cyan'}`}>{stats.cpu_temp?.toFixed(1)} °C</span></div>
                                    <div className="detail-row"><span className="d-lbl">Power Draw</span><span className="d-val c-yellow">{stats.cpu_power_w} W</span></div>
                                    <div className="detail-row"><span className="d-lbl">Core Voltage</span><span className="d-val">{stats.cpu_voltage} V</span></div>
                                    <div className="detail-row"><span className="d-lbl">Freq Max</span><span className="d-val">{stats.cpu_freq_max_ghz?.toFixed(2)} GHz</span></div>
                                </div>
                            </Widget>

                            {/* GPU NVIDIA */}
                            <Widget id="gpu_nv" title="NVIDIA RTX 3050" icon="🎮" category="COMPUTE" mainValue={stats.gpu_nvidia_percent?.toFixed(1)} mainUnit="%">
                                <div className="primary-metric purple">
                                    {stats.gpu_nvidia_percent?.toFixed(1)} <span className="metric-unit">% LOAD</span>
                                </div>
                                <div className="bar-wrap">
                                    <div className="bar-container"><div className={`bar-fill bg-purple`} style={{width: `${stats.gpu_nvidia_percent}%`}}></div></div>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Temperature</span><span className={`d-val ${stats.gpu_nvidia_temp > 80 ? 'c-red' : 'c-cyan'}`}>{stats.gpu_nvidia_temp} °C</span></div>
                                    <div className="detail-row"><span className="d-lbl">Core Clock</span><span className="d-val c-yellow">{stats.gpu_nvidia_clock_mhz} MHz</span></div>
                                    <div className="detail-row"><span className="d-lbl">Power Draw</span><span className="d-val">{stats.gpu_nvidia_power_w} W</span></div>
                                    <div className="detail-row"><span className="d-lbl">VRAM Used</span><span className="d-val c-cyan">{stats.gpu_nvidia_mem_used} / {stats.gpu_nvidia_mem_total} MB</span></div>
                                </div>
                            </Widget>

                            {/* GPU INTEL */}
                            <Widget id="gpu_int" title="INTEL IRIS XE" icon="📺" category="COMPUTE" mainValue={stats.gpu_intel_percent?.toFixed(1)} mainUnit="%">
                                <div className="primary-metric" style={{color: '#aaa'}}>
                                    {stats.gpu_intel_percent?.toFixed(1)} <span className="metric-unit">% LOAD</span>
                                </div>
                                <div className="bar-wrap">
                                    <div className="bar-container"><div className={`bar-fill bg-cyan`} style={{width: `${stats.gpu_intel_percent}%`}}></div></div>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Temperature</span><span className="d-val c-cyan">{stats.gpu_intel_temp?.toFixed(1)} °C</span></div>
                                    <div className="detail-row"><span className="d-lbl">Core Clock</span><span className="d-val">{stats.gpu_intel_clock_mhz} MHz</span></div>
                                    <div className="detail-row"><span className="d-lbl">HAGS Scheduler</span><span className="d-val c-green">ACTIVE</span></div>
                                    <div className="detail-row"><span className="d-lbl">Shared VRAM</span><span className="d-val">{stats.gpu_intel_vram_used} / {stats.gpu_intel_vram_total} MB</span></div>
                                </div>
                            </Widget>

                            {/* RAM */}
                            <Widget id="ram" title="PHYSICAL MEMORY" icon="🧠" category="MEMORY" mainValue={stats.ram_percent?.toFixed(1)} mainUnit="%">
                                <div className="primary-metric cyan">
                                    {stats.ram_percent?.toFixed(1)} <span className="metric-unit">% USED</span>
                                </div>
                                <div className="bar-wrap">
                                    <div className="bar-container"><div className={`bar-fill ${getBarColor(stats.ram_percent, [75, 90])}`} style={{width: `${stats.ram_percent}%`}}></div></div>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Allocation</span><span className="d-val c-cyan">{stats.ram_used_gb} / {stats.ram_total_gb} GB</span></div>
                                    <div className="detail-row"><span className="d-lbl">Compression</span><span className="d-val c-green">ON ({stats.ram_compression_ratio})</span></div>
                                    <div className="detail-row"><span className="d-lbl">Page Faults/s</span><span className="d-val c-yellow">{stats.ram_page_faults}</span></div>
                                    <div className="detail-row"><span className="d-lbl">Active Cleanups</span><span className="d-val">{stats.ram_cleanups}</span></div>
                                </div>
                            </Widget>

                            {/* SWAP / NVME */}
                            <Widget id="swap" title="NVME SWAP (PAGEFILE)" icon="💽" category="MEMORY" mainValue={stats.swap_percent?.toFixed(1)} mainUnit="%">
                                <div className="primary-metric" style={{color: 'var(--warning-neon)'}}>
                                    {stats.swap_percent?.toFixed(1)} <span className="metric-unit">% USED</span>
                                </div>
                                <div className="bar-wrap">
                                    <div className="bar-container"><div className={`bar-fill bg-warning`} style={{width: `${stats.swap_percent}%`}}></div></div>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Allocation</span><span className="d-val">{stats.swap_used_gb} / {stats.swap_total_gb} GB</span></div>
                                    <div className="detail-row"><span className="d-lbl">Read Speed</span><span className="d-val c-cyan">{stats.disk_read_mbps} MB/s</span></div>
                                    <div className="detail-row"><span className="d-lbl">Write Speed</span><span className="d-val c-cyan">{stats.disk_write_mbps} MB/s</span></div>
                                    <div className="detail-row"><span className="d-lbl">IOPS (R/W)</span><span className="d-val">{stats.disk_read_iops} / {stats.disk_write_iops}</span></div>
                                </div>
                            </Widget>

                            {/* OS KERNEL */}
                            <Widget id="kernel" title="OS KERNEL METRICS" icon="⚙️" category="COMPUTE" mainValue={stats.threads_total} mainUnit="THD">
                                <div className="primary-metric">
                                    {stats.threads_total} <span className="metric-unit">THREADS</span>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Context Switches</span><span className="d-val">{stats.ctx_switches?.toLocaleString()}</span></div>
                                    <div className="detail-row"><span className="d-lbl">HW Interrupts</span><span className="d-val">{stats.interrupts?.toLocaleString()}</span></div>
                                    <div className="detail-row"><span className="d-lbl">System Calls</span><span className="d-val">{stats.syscalls?.toLocaleString()}</span></div>
                                    <div className="detail-row"><span className="d-lbl">Open Handles</span><span className="d-val">{stats.handles_total?.toLocaleString()}</span></div>
                                </div>
                            </Widget>

                            {/* NETWORK */}
                            <Widget id="network" title="NETWORK QOS" icon="🌐" category="IO_NET" mainValue={stats.ping_ms} mainUnit="ms">
                                <div className="primary-metric" style={{color: stats.ping_ms < 50 ? 'var(--success-neon)' : 'var(--warning-neon)'}}>
                                    {stats.ping_ms} <span className="metric-unit">ms PING</span>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Download</span><span className="d-val c-cyan">{stats.net_down_kbps} KB/s</span></div>
                                    <div className="detail-row"><span className="d-lbl">Upload</span><span className="d-val c-purple">{stats.net_up_kbps} KB/s</span></div>
                                    <div className="detail-row"><span className="d-lbl">TCP Conns</span><span className="d-val">{stats.tcp_connections}</span></div>
                                    <div className="detail-row"><span className="d-lbl">Nagle Auth</span><span className="d-val c-red">DISABLED</span></div>
                                </div>
                            </Widget>

                            {/* SECURITY / PRIVACY */}
                            <Widget id="security" title="SECURITY & PRIVACY" icon="🛡️" category="SECURITY" mainValue={stats.privacy_score} mainUnit="%">
                                <div className="primary-metric c-green">
                                    {stats.privacy_score} <span className="metric-unit">% SAFE</span>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Ads Blocked</span><span className="d-val c-yellow">{stats.ads_blocked?.toLocaleString()}</span></div>
                                    <div className="detail-row"><span className="d-lbl">Telemetry</span><span className="d-val c-green">SINKHOLED</span></div>
                                    <div className="detail-row"><span className="d-lbl">RPC Ports</span><span className="d-val c-red">BLOCKED (135/139/445)</span></div>
                                    <div className="detail-row"><span className="d-lbl">Defender I/O</span><span className="d-val c-cyan">EXCLUSIONS APPLIED</span></div>
                                </div>
                            </Widget>

                            {/* PROCESS SCHEDULER */}
                            <Widget id="scheduler" title="DYNAMIC SCHEDULER" icon="⚖️" category="COMPUTE" mainValue={stats.priority_high} mainUnit="HI">
                                <div className="primary-metric c-purple">
                                    {stats.priority_high} <span className="metric-unit">HIGH PRIO</span>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Low Prio (Yield)</span><span className="d-val">{stats.priority_low}</span></div>
                                    <div className="detail-row"><span className="d-lbl">Timer Resolution</span><span className="d-val c-cyan">0.5 ms</span></div>
                                    <div className="detail-row"><span className="d-lbl">HPET State</span><span className="d-val c-red">DISABLED</span></div>
                                    <div className="detail-row"><span className="d-lbl">Affinity</span><span className="d-val c-green">CORES 0-3 ISOLATED</span></div>
                                </div>
                            </Widget>

                            {/* POWER */}
                            <Widget id="power" title="ACPI POWER MATRIX" icon="🔋" category="IO_NET" mainValue={stats.battery_percent} mainUnit="%">
                                <div className="primary-metric" style={{color: stats.power_plugged ? 'var(--success-neon)' : 'var(--warning-neon)'}}>
                                    {stats.battery_percent} <span className="metric-unit">% BATT</span>
                                </div>
                                <div className="detail-list" style={{marginTop: '16px'}}>
                                    <div className="detail-row"><span className="d-lbl">Power Source</span><span className={`d-val ${stats.power_plugged ? 'c-green' : 'c-yellow'}`}>{stats.power_plugged ? 'AC ADAPTER' : 'BATTERY'}</span></div>
                                    <div className="detail-row"><span className="d-lbl">Core Parking</span><span className="d-val c-red">DISABLED</span></div>
                                    <div className="detail-row"><span className="d-lbl">C-States</span><span className="d-val c-red">DISABLED</span></div>
                                    <div className="detail-row"><span className="d-lbl">Thermal Throttle</span><span className={`d-val ${stats.cpu_temp > 85 ? 'c-red' : 'c-green'}`}>{stats.cpu_temp > 85 ? 'ACTIVE' : 'INACTIVE'}</span></div>
                                </div>
                            </Widget>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
